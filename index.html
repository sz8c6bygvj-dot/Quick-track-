<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickTrack — Web App</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
      --success: #22c55e;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .app-container {
      width: 100%;
      max-width: 540px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
      height: fit-content;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-add {
      background: var(--accent);
      color: #0f172a;
      padding: 0 1.25rem;
      font-size: 0.95rem;
    }

    .btn-add:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    .filters {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .filter-btn {
      background: transparent;
      color: var(--muted);
      padding: 0.4rem 0.75rem;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    .filter-btn.active {
      background: var(--bg);
      color: var(--text);
    }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    li {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.85rem 1rem;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
      cursor: pointer;
    }

    .checkbox {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--muted);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    li.completed .checkbox {
      background: var(--success);
      border-color: var(--success);
    }

    li.completed .checkbox::after {
      content: "✓";
      color: #0f172a;
      font-size: 0.8rem;
      font-weight: bold;
    }

    li.completed .task-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .btn-delete {
      background: transparent;
      color: var(--muted);
      padding: 0.3rem 0.5rem;
      font-size: 0.85rem;
    }

    .btn-delete:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 2rem 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>QuickTrack</h1>
      <span class="badge" id="counter">0 left</span>
    </header>

    <form class="input-group" id="taskForm">
      <input type="text" id="taskInput" placeholder="Add a new item or milestone..." required />
      <button type="submit" class="btn-add">Add</button>
    </form>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="taskList"></ul>
    <div class="empty-state" id="emptyState">Nothing here yet. Add your first item above!</div>
  </div>

  <script>
    const taskForm = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");
    const emptyState = document.getElementById("emptyState");
    const counter = document.getElementById("counter");
    const filterBtns = document.querySelectorAll(".filter-btn");

    let tasks = JSON.parse(localStorage.getItem("quicktrack_tasks")) || [];
    let currentFilter = "all";

    function saveTasks() {
      localStorage.setItem("quicktrack_tasks", JSON.stringify(tasks));
    }

    function renderTasks() {
      taskList.innerHTML = "";

      const filtered = tasks.filter(task => {
        if (currentFilter === "active") return !task.completed;
        if (currentFilter === "completed") return task.completed;
        return true;
      });

      emptyState.style.display = filtered.length === 0 ? "block" : "none";

      const remaining = tasks.filter(t => !t.completed).length;
      counter.textContent = `${remaining} left`;

      filtered.forEach(task => {
        const li = document.createElement("li");
        if (task.completed) li.classList.add("completed");

        li.innerHTML = `
          <div class="task-left">
            <div class="checkbox"></div>
            <span class="task-text"></span>
          </div>
          <button class="btn-delete" title="Delete">✕</button>
        `;

        li.querySelector(".task-text").textContent = task.text;

        li.querySelector(".task-left").addEventListener("click", () => {
          task.completed = !task.completed;
          saveTasks();
          renderTasks();
        });

        li.querySelector(".btn-delete").addEventListener("click", () => {
          tasks = tasks.filter(t => t.id !== task.id);
          saveTasks();
          renderTasks();
        });

        taskList.appendChild(li);
      });
    }

    taskForm.addEventListener("submit", e => {
      e.preventDefault();
      const text = taskInput.value.trim();
      if (!text) return;

      tasks.unshift({
        id: Date.now(),
        text,
        completed: false
      });

      taskInput.value = "";
      saveTasks();
      renderTasks();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        filterBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        renderTasks();
      });
    });

    renderTasks();
  </script>
</body>
</html>
